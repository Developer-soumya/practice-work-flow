name: Build My React project

on:
 push :
   branches: [main]

jobs:
  build-react-app:
    runs-on: ubuntu-latest

    steps:
     - uses: actions/checkout@v7
     - name: setup Node js
       uses: actions/setup-node@v7.1.0
       with:  
          node-version:22.x
      - name : Install Dependencies
        run : npm install
      - name : Build React App
        run : npm run build
     
    

